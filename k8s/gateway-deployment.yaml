apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
      - name: gateway
        image: YOUR_DOCKERHUB_USERNAME/gateway:v1

        ports:
        - containerPort: 3000